<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">MVC and Django MVT role comparison</title>
  <desc id="desc">Model maps to Model, MVC View maps to Django Template, and MVC Controller maps approximately to Django View. Django URL routing selects the view.</desc>
  <defs>
    <style>
      .title { font: 700 60px 'Aptos Display', 'Segoe UI', sans-serif; fill: #14233a; }
      .subtitle { font: 28px 'Aptos', 'Segoe UI', sans-serif; fill: #475569; }
      .panel-title { font: 700 38px 'Aptos Display', 'Segoe UI', sans-serif; fill: #ffffff; }
      .role { font: 700 34px 'Aptos Display', 'Segoe UI', sans-serif; fill: #14233a; }
      .detail { font: 24px 'Aptos', 'Segoe UI', sans-serif; fill: #475569; }
      .route { font: 700 24px 'Aptos', 'Segoe UI', sans-serif; fill: #714b0c; }
      .flow-label { font: 700 22px 'Aptos', 'Segoe UI', sans-serif; fill: #475569; }
      .flow { font: 25px 'Aptos', 'Segoe UI', sans-serif; fill: #14233a; }
      .map { font: 22px 'Aptos', 'Segoe UI', sans-serif; fill: #475569; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1 L10 6 L1 11" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#f7f8f6"/>
  <text x="80" y="92" class="title">MVC and Django MVT</text>
  <text x="82" y="136" class="subtitle">A role map for reading a small web application</text>

  <rect x="64" y="175" width="704" height="626" rx="22" fill="#edf3f9" stroke="#bfd1e2" stroke-width="2"/>
  <rect x="832" y="175" width="704" height="626" rx="22" fill="#e9f5f2" stroke="#b8d9d1" stroke-width="2"/>
  <path d="M64 197 Q64 175 86 175 H746 Q768 175 768 197 V245 H64 Z" fill="#275b83"/>
  <path d="M832 197 Q832 175 854 175 H1514 Q1536 175 1536 197 V245 H832 Z" fill="#1c7167"/>
  <text x="416" y="224" text-anchor="middle" class="panel-title">MVC</text>
  <text x="1184" y="224" text-anchor="middle" class="panel-title">Django MVT + URL</text>

  <rect x="874" y="260" width="620" height="54" rx="12" fill="#fff2d5" stroke="#d99629" stroke-width="2"/>
  <text x="1184" y="294" text-anchor="middle" class="route">URL routing selects a View</text>
  <text x="416" y="292" text-anchor="middle" class="map">Compare the jobs each component performs</text>

  <rect x="106" y="336" width="620" height="112" rx="16" fill="#ffffff" stroke="#88aecb" stroke-width="2"/>
  <rect x="874" y="336" width="620" height="112" rx="16" fill="#ffffff" stroke="#79b7a8" stroke-width="2"/>
  <text x="138" y="386" class="role">Model</text>
  <text x="138" y="421" class="detail">Data and rules</text>
  <text x="906" y="386" class="role">Model</text>
  <text x="906" y="421" class="detail">Data and rules</text>

  <rect x="106" y="472" width="620" height="112" rx="16" fill="#ffffff" stroke="#88aecb" stroke-width="2"/>
  <rect x="874" y="472" width="620" height="112" rx="16" fill="#ffffff" stroke="#79b7a8" stroke-width="2"/>
  <text x="138" y="522" class="role">View</text>
  <text x="138" y="557" class="detail">Presents the interface</text>
  <text x="906" y="522" class="role">Template</text>
  <text x="906" y="557" class="detail">Renders HTML</text>

  <rect x="106" y="608" width="620" height="112" rx="16" fill="#ffffff" stroke="#88aecb" stroke-width="2"/>
  <rect x="874" y="608" width="620" height="112" rx="16" fill="#ffffff" stroke="#79b7a8" stroke-width="2"/>
  <text x="138" y="658" class="role">Controller</text>
  <text x="138" y="693" class="detail">Handles input and coordinates</text>
  <text x="906" y="658" class="role">View</text>
  <text x="906" y="693" class="detail">Handles requests and coordinates</text>

  <path d="M778 392 H818" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M778 528 H818" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M778 664 H818" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>

  <text x="106" y="760" class="flow-label">REQUEST PATH</text>
  <text x="874" y="760" class="flow-label">REQUEST PATH</text>
  <text x="106" y="790" class="flow">Request &#8594; Controller &#8594; View</text>
  <text x="874" y="790" class="flow">Request &#8594; URL &#8594; View &#8594; Template</text>

  <text x="800" y="855" text-anchor="middle" class="subtitle">In both patterns, the request handler uses the Model when data is needed.</text>
</svg>
