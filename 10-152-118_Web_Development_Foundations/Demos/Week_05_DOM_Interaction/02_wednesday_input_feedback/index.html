<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DOM Input Demo</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="panel">
    <h1>Greeting Builder</h1>
    <label for="nameInput">Name</label>
    <input id="nameInput" type="text" placeholder="Enter a name">
    <button id="greetButton">Create greeting</button>
    <p id="message">Your greeting will appear here.</p>
  </main>
  <script src="script.js"></script>
</body>
</html>
