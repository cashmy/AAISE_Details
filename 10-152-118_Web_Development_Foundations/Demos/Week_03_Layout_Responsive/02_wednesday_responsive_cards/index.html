<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Responsive Resource Cards</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="hero">
    <h1>Student Resource Cards</h1>
    <p>Resize the browser to see the layout adapt.</p>
  </header>

  <main class="page">
    <section class="card-grid">
      <article class="card">
        <h2>Library</h2>
        <p>Find research help, databases, and citation support.</p>
      </article>
      <article class="card">
        <h2>Tutoring</h2>
        <p>Schedule study support for writing, math, and technology.</p>
      </article>
      <article class="card">
        <h2>Technology</h2>
        <p>Get help with accounts, devices, and software access.</p>
      </article>
    </section>
  </main>
</body>
</html>
