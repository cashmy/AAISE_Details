<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Multi-Issue Debugging Demo</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="panel">
    <h1>Debugging Checklist</h1>
    <label for="taskInput">Task</label>
    <input id="taskInput" type="text" placeholder="Enter one task">
    <button id="addButton">Add task</button>
    <p id="status">No task added yet.</p>
    <ul id="taskList"></ul>
  </main>
  <script src="script.js"></script>
</body>
</html>
