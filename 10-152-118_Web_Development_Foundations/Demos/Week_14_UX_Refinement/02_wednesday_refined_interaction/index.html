<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Refined Study Planner</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="panel">
    <h1>Study Session Planner</h1>
    <p class="lede">Enter the time you have available and get a clear next step.</p>
    <label for="minutesInput">Minutes available</label>
    <input id="minutesInput" type="number" min="1" placeholder="Example: 30">
    <button id="planButton">Create study plan</button>
    <p id="result" role="status">Your plan will appear here.</p>
  </main>
  <script src="script.js"></script>
</body>
</html>
