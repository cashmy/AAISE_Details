<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Study Sprint - Simulated Login</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="panel">
    <h1>Study Sprint Simulated Login</h1>
    <p>This form practices input handling. It is not real authentication.</p>
    <form id="loginForm">
      <label for="username">Username</label>
      <input id="username" type="text" autocomplete="username">
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password">
      <button type="submit">Sign in</button>
    </form>
    <p id="message" role="status">Use the demo credentials to test the form.</p>
  </main>
  <script src="script.js"></script>
</body>
</html>
