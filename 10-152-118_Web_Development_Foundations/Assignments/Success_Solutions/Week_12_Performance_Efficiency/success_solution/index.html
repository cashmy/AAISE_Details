<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Study Sprint - Resource Search</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page">
    <h1>Study Sprint Resource Search</h1>
    <p>Search the resource list. Filtering waits briefly so repeated typing does less unnecessary work.</p>
    <label for="searchInput">Search resources</label>
    <input id="searchInput" type="search" placeholder="Try library, tutoring, or planning">
    <p id="status">Showing all resources.</p>
    <ul id="resourceList"></ul>
  </main>
  <script src="script.js"></script>
</body>
</html>
