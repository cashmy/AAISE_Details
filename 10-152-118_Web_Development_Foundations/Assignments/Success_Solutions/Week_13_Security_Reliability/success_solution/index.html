<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Study Sprint - Safe Note Preview</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page">
    <h1>Safe Study Note Preview</h1>

    <button id="previewButton">Preview note</button>
    <p id="feedback">No note previewed yet.</p>
  </main>
  <script src="script.js"></script>
</body>
</html>
